<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OneDay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
--bg:          #000000;
--surface:     rgba(255,255,255,0.04);
--surface-md:  rgba(255,255,255,0.07);
--surface-hi:  rgba(255,255,255,0.11);
--border:      rgba(255,255,255,0.10);
--border-hi:   rgba(255,255,255,0.22);
--text:        #ffffff;
--text-muted:  rgba(255,255,255,0.50);
--text-dim:    rgba(255,255,255,0.25);
--shadow:      0 8px 40px rgba(0,0,0,0.8);
--blur:        blur(24px);
--radius:      22px;
--radius-sm:   14px;
--radius-xs:   10px;
--font-display:'Syne', sans-serif;
--font-body:   'DM Sans', sans-serif;
--nav-h:       76px;
--max-w:       500px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
height: 100%; overflow: hidden;
background: #000; color: #fff;
font-family: var(--font-body);
-webkit-font-smoothing: antialiased;
-webkit-tap-highlight-color: transparent;
user-select: none;
}
body::before {
content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
background: radial-gradient(ellipse 60% 50% at 15% 5%, rgba(255,255,255,0.03) 0%, transparent 70%),
radial-gradient(ellipse 40% 40% at 85% 95%, rgba(255,255,255,0.02) 0%, transparent 70%);
}
body::after {
content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
opacity: 0.035;
}
#app { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
.screen { display: none; position: absolute; inset: 0; width: 100%; height: 100%; flex-direction: column; align-items: center; overflow: hidden; }
.screen.active { display: flex; }
.glass { background: var(--surface); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.06); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px 32px; border: none; border-radius: 100px; cursor: pointer; font-family: var(--font-body); font-size: 16px; font-weight: 500; transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1); outline: none; }
.btn:active { transform: scale(0.93); }
.btn-primary { background: #fff; color: #000; }
.btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
.glass-input { padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: #fff; outline: none; width: 100%; }
#screen-landing { justify-content: center; padding: 40px 24px; text-align: center; }
.landing-logo { font-family: var(--font-display); font-size: 88px; font-weight: 800; line-height: 1; margin-bottom: 12px; letter-spacing: -2px; }
.landing-tagline { font-size: 18px; font-weight: 300; color: var(--text-muted); font-style: italic; margin-bottom: 52px; }
#screen-login { justify-content: center; padding: 40px 24px; text-align: center; }
.login-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-bottom: 32px; }
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: rgba(0,0,0,0.88); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px); border-top: 1px solid var(--border); display: flex; z-index: 100; }
.nav-inner { width: 100%; max-width: var(--max-w); display: flex; align-items: center; justify-content: center; margin: 0 auto; padding: 0 16px; }
.nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; border-radius: 16px; cursor: pointer; color: var(--text-dim); font-size: 11px; font-weight: 500; }
.nav-btn.active { color: #fff; }
.tab { display: none; height: 100%; overflow-y: auto; padding: 40px 20px 120px; width: 100%; max-width: var(--max-w); }
.tab.active { display: block; }
.habits-list { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
.habit-card { display: flex; align-items: center; justify-content: space-between; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.habit-card.completed { opacity: 0.4; }
.habit-card.completed .habit-name { text-decoration: line-through; }
.cal-row { display: flex; gap: 8px; margin-top: 24px; justify-content: space-between; }
.cal-day { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 4px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); }
.cal-day.today { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.15); }
.cal-day.completed { background: #fff; color: #000; }
.cal-day.completed span { color: #000 !important; }
#toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 14px 28px; border-radius: 100px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }
</style>
</head>
<body>
<div id="app">
<div id="screen-landing" class="screen active">
<div class="landing-logo">OneDay</div>
<div class="landing-tagline">Master your focus.</div>
<button class="btn btn-primary" onclick="showScreen('login')">Get Started</button>
</div>
<div id="screen-login" class="screen">
<div class="login-title">Sign In</div>
<div id="g-signin-btn" style="width: 100%; max-width: 300px; margin: 0 auto;"></div>
</div>
<div id="screen-app" class="screen">
<div id="tab-home" class="tab active">
<h1 id="greeting" style="font-family: var(--font-display); font-size: 24px;">Level 1 • 0 XP</h1>
<div id="streak" style="margin-top:10px; font-size:14px; color:#aaa;">0 day streak 🔥</div>
<div id="calendar-view" class="cal-row"></div>
<div style="margin-top: 32px; display: flex; gap: 10px;">
<input type="text" id="habit-input" class="glass-input" placeholder="What's your next habit?">
<button class="btn btn-primary" onclick="addHabit()" style="padding: 0 20px;">Add</button>
</div>
<div id="habits-container" class="habits-list"></div>
</div>
<div id="tab-settings" class="tab">
  <h2 style="font-family: var(--font-display); margin-bottom: 24px;">Settings</h2>

  <div class="glass" style="padding: 24px; display:flex; flex-direction:column; gap:12px;">

    <!-- USER INFO -->
    <p id="user-info" style="color: var(--text-muted); font-size: 14px;"></p>

    <!-- 🔥 FREEZE STATUS -->
    <div id="freeze-status" style="font-size:12px; color:#aaa;"></div>

    <!-- 🔥 PAUSE STREAK BUTTON -->
    <button class="btn btn-ghost" onclick="activateFreeze(5)">
      Pause streak (5 days ❄️)
    </button>

    <!-- (OPTIONAL) MORE OPTIONS -->
    <button class="btn btn-ghost" onclick="activateFreeze(10)">
      Pause 10 days
    </button>

    <!-- LOGOUT -->
    <button class="btn btn-ghost" onclick="logout()">
      Sign Out
    </button>

  </div>
</div>
<nav class="bottom-nav">
<div class="nav-inner">
<div id="nav-home" class="nav-btn active" onclick="switchTab('home')">Home</div>
<div id="nav-settings" class="nav-btn" onclick="switchTab('settings')">Settings</div>
</div>
</nav>
</div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const GOOGLE_CLIENT_ID = "477601601786-2cacqtv0mbmcu5c1dcb28e69um9g0ssi.apps.googleusercontent.com";
const SUPABASE_URL = "https://fetxibwbyxbaliemiyck.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZldHhpYndieXhiYWxpZW1peWNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMDk0MjgsImV4cCI6MjA5MDg4NTQyOH0.pjvLuezScdPDGuw46kXvAk8c5f0TK3i7PkrIpz0asKI";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
function parseJwt(token) {
try {
return JSON.parse(atob(token.split('.')[1]));
} catch (e) {
return null;
}
}
function initGoogle() {
google.accounts.id.initialize({
client_id: GOOGLE_CLIENT_ID,
callback: handleCredentialResponse
});
google.accounts.id.renderButton(
document.getElementById("g-signin-btn"),
{ theme: "outline", size: "large", width: "100%" }
);
}
// Failsafe for Google Init
setTimeout(initGoogle, 500);
async function handleCredentialResponse(response) {
const data = parseJwt(response.credential);
if (data) {
const userObj = { name: data.name, email: data.email };
localStorage.setItem("userAuth", JSON.stringify(userObj));
await ensureUserExists(userObj);
showApp();
showToast("Welcome back 🚀");
await refreshAppData();
}
}
async function ensureUserExists(user) {
const { data } = await supabase
.from("users")
.select("*")
.eq("email", user.email)
.single();
if (!data) {
await supabase.from("users").insert([
{
email: user.email,
name: user.name,
xp: 0
}
]);
}
}
function getLevel(xp) {
return Math.floor(xp / 100) + 1;
}
async function loadUserStats() {
const user = JSON.parse(localStorage.getItem("userAuth"));
if (!user) return;
const { data } = await supabase
.from("users")
.select("xp")
.eq("email", user.email)
.single();
const xp = data?.xp || 0;
const level = getLevel(xp);
document.getElementById("greeting").textContent = `Level ${level} • ${xp} XP`;
}
// ✅ FIX 1 — calculateStreak() — freeze-aware, fully complete
async function calculateStreak() {
  const user = JSON.parse(localStorage.getItem("userAuth"));
  if (!user) return 0;

  const { data: userData } = await supabase
    .from("users")
    .select("freeze_until, streak")
    .eq("email", user.email)
    .single();

  const today = new Date().toISOString().split("T")[0];

  // ❄️ If freeze is active, return stored streak untouched
  if (userData?.freeze_until && userData.freeze_until >= today) {
    return userData.streak || 0;
  }

  const { data } = await supabase
    .from("completions")
    .select("date")
    .eq("user_id", user.email)
    .order("date", { ascending: false });

  if (!data || data.length === 0) return 0;

  let streak = 0;
  const current = new Date();
  current.setHours(0, 0, 0, 0);

  const uniqueDates = [...new Set(data.map(d => d.date))];

  for (let i = 0; i < 365; i++) {
    const checkDate = new Date();
    checkDate.setDate(current.getDate() - i);
    checkDate.setHours(0, 0, 0, 0);
    const str = checkDate.toISOString().split("T")[0];

    if (uniqueDates.includes(str)) {
      streak++;
    } else {
      if (i === 0) continue; // missed today but not yesterday — don't break yet
      break;
    }
  }

  return streak;
}

// ✅ FIX 2 — updateStreakUI() — calls calculateStreak() properly
async function updateStreakUI() {
  const streak = await calculateStreak();
  document.getElementById("streak").textContent = `${streak} day streak 🔥`;
}
async function refreshAppData() {
await loadUserStats();
await loadHabits();
await renderCalendar();
await updateStreakUI();
await updateFreezeStatus(); // ✅ FIX 4 — keep freeze UI in sync
}
function showScreen(screenId) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.getElementById('screen-' + screenId).classList.add('active');
}
function showApp() {
const user = JSON.parse(localStorage.getItem("userAuth"));
if (user) {
document.getElementById('user-info').textContent = `Signed in as ${user.email}`;
showScreen('app');
}
}
function switchTab(tabId) {
document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
document.getElementById('tab-' + tabId).classList.add('active');
document.getElementById('nav-' + tabId).classList.add('active');
}
async function addHabit() {
const input = document.getElementById("habit-input");
const value = input.value.trim();
if (!value) return;
const user = JSON.parse(localStorage.getItem("userAuth"));
if (!user) return;
const { error } = await supabase.from("habits").insert([
{ name: value, user_id: user.email }
]);
if (error) {
showToast("Error adding habit");
} else {
input.value = "";
await refreshAppData();
showToast("Habit added");
}
}
async function loadHabits() {
const user = JSON.parse(localStorage.getItem("userAuth"));
if (!user) return;
const { data: habits } = await supabase.from("habits").select("*").eq("user_id", user.email);
const { data: completions } = await supabase.from("completions")
.select("*")
.eq("user_id", user.email)
.eq("date", new Date().toISOString().split("T")[0]);
renderHabits(habits || [], completions || []);
}
function renderHabits(habits, completions) {
const container = document.getElementById("habits-container");
container.innerHTML = "";
habits.forEach(habit => {
const isDone = completions.some(c => c.habit_id === habit.id);
const el = document.createElement("div");
el.className = `habit-card ${isDone ? 'completed' : ''}`;

el.innerHTML = `
  <span class="habit-name">${habit.name}</span>
  <button class="btn btn-primary"
    onclick="completeHabit(${habit.id})"
    ${isDone ? 'disabled' : ''}
    style="padding: 8px 16px; font-size: 12px; height: 32px;">
    ${isDone ? 'Done' : 'Complete'}
  </button>
`;
container.appendChild(el);
});
}
async function completeHabit(habitId) {
const user = JSON.parse(localStorage.getItem("userAuth"));
if (!user) return;
const today = new Date().toISOString().split("T")[0];
const { data: existing } = await supabase
.from("completions")
.select("*")
.eq("habit_id", habitId)
.eq("user_id", user.email)
.eq("date", today);
if (existing && existing.length > 0) {
showToast("Already done today");
return;
}
await supabase.from("completions").insert([
{
habit_id: habitId,
user_id: user.email,
date: today
}
]);
const { data: userData } = await supabase
.from("users")
.select("xp")
.eq("email", user.email)
.single();
const newXP = (userData?.xp || 0) + 10;
await supabase
.from("users")
.update({ xp: newXP })
.eq("email", user.email);
  const streak = await calculateStreak();

await supabase
  .from("users")
  .update({ streak })
  .eq("email", user.email);
showToast("+10 XP");
await refreshAppData();
}
async function renderCalendar() {
const user = JSON.parse(localStorage.getItem("userAuth"));
if (!user) return;
const container = document.getElementById("calendar-view");
container.innerHTML = "";
const today = new Date();
const { data: habits } = await supabase.from("habits").select("id").eq("user_id", user.email);
const totalHabits = habits ? habits.length : 0;
const { data: completions } = await supabase.from("completions")
.select("date")
.eq("user_id", user.email);
const completedDatesMap = {};
(completions || []).forEach(c => {
if (!completedDatesMap[c.date]) {
completedDatesMap[c.date] = 0;
}
completedDatesMap[c.date]++;
});
for (let i = -3; i <= 3; i++) {
const d = new Date();
d.setDate(today.getDate() + i);
const dateStr = d.toISOString().split("T")[0];
const isToday = i === 0;
// Pro Mode logic: Day completed only if all habits are done
const isCompleted = (completedDatesMap[dateStr] || 0) >= totalHabits && totalHabits > 0;
const dayEl = document.createElement("div");
dayEl.className = `cal-day ${isToday ? 'today' : ''} ${isCompleted ? 'completed' : ''}`;
dayEl.innerHTML = `
  <span style="font-size:10px; opacity:0.6;">
    ${d.toLocaleDateString('en-US', { weekday: 'short' })}
  </span>
  <span class="cal-day-num">${d.getDate()}</span>
`;
container.appendChild(dayEl);
}
}
function showToast(msg) {
const t = document.getElementById("toast");
t.textContent = msg;
t.classList.add("show");
setTimeout(() => t.classList.remove("show"), 3000);
}
function logout() {
localStorage.removeItem("userAuth");
location.reload();
}

async function activateFreeze(days) {
  const user = JSON.parse(localStorage.getItem("userAuth"));
  if (!user) return;

  const { data: userData } = await supabase
    .from("users")
    .select("freeze_until")
    .eq("email", user.email)
    .single();

  let baseDate = new Date();

  if (userData?.freeze_until) {
    const existing = new Date(userData.freeze_until);
    if (existing > baseDate) {
      baseDate = existing;
    }
  }

  baseDate.setDate(baseDate.getDate() + days);

  const freezeUntil = baseDate.toISOString().split("T")[0];

  const currentStreak = await calculateStreak();

  const { error } = await supabase
    .from("users")
    .update({ freeze_until: freezeUntil, streak: currentStreak })
    .eq("email", user.email);

  if (error) {
    showToast("Could not activate freeze ❌");
    return;
  }

  showToast(`Streak paused till ${freezeUntil} ❄️`);

  await refreshAppData(); // 🔥 IMPORTANT (not just updateFreezeStatus)
  }

// ✅ FIX 3 — ❄️ updateFreezeStatus: updates the #freeze-status element in Settings
async function updateFreezeStatus() {
  const user = JSON.parse(localStorage.getItem("userAuth"));
  const el = document.getElementById("freeze-status");
  if (!user || !el) return;

  const { data } = await supabase
    .from("users")
    .select("freeze_until")
    .eq("email", user.email)
    .single();

  const today = new Date().toISOString().split("T")[0];

  if (data?.freeze_until && data.freeze_until >= today) {
    el.textContent = `❄️ Streak paused until ${data.freeze_until}`;
    el.style.color = "#7dd3fc"; // soft blue for freeze indicator
  } else {
    el.textContent = "";
  }
}
window.onload = async () => {
  initGoogle(); // ✅ ADD THIS (VERY IMPORTANT)

  const userStr = localStorage.getItem("userAuth");
  if (userStr) {
    showApp();
    await refreshAppData();
  }
};
</script>
</body>
</html>
